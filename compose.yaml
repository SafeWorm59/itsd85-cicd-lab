name: itsd85

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    container_name: itsd85-app
    ports:
      - "8080:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - APP_VERSION=${APP_VERSION:-local}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

